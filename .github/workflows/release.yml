name: cd ( main - publish release)

on:
	push:
		tags:
			- 'v*'

permissions:
	contents: write
	
jobs:
	release:
		runs-on: ubuntu-24.04
		
		steps:
			- uses: actions/checkout@v6
			
			- uses: actions/setup-go@v7
				with:
					go-version: '1.27.3'
					
			- name: run tests
				run: go test ./...
			
			- name: build release binary
				env:
					CGO_ENABLED: '0'
					GOOS: linux
					GOARCH: amd64
				run: |
					mkdir -p dist
					go build -trimpath \
						-o dist/app \
						./cmd/app/
			- name: publish github release
				env:
					GH_TOKEN: ${{ github.token }}
					TAG: ${{ github.ref_name }}
				run: |
					gh release create "$TAG" \
						dist/app-linux-amd64.tar.gz \
						dist/checksums.txt \
						--verify-tag \
						--generate-notes \
						--title "$TAG"