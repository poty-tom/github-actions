name: ci (feature to dev - development verify)

on:
	pull_request:
		branches:
			- dev
		types:
			- opend
			- synchronize
			- reopend

permissions:
	contents: read

jobs:
	lint:
		name: go-lint
		runs-on: ubuntu-24.04
		
		steps:
			- uses: actions/checkout@v6
			
			- uses: actions/setup-go@7
				with:
					go-version: '1.27.3'
			
			- name: run golangci-lint
				uses: golangci/golangci-lint-action@v9
				with:
					version: v2.15.0

	test:
		name: test
		runs-on: ubuntu-24.04
		
		steps:
			- uses: actions/checkout@v6
			
			- uses: actions/setup-go@v7
				with:
					go-version: '1.27.3'
					
			- name: run tests
				run: go test ./...
				
	build:
    name: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'

      - name: Build
        run: go build ./...		